id: scriptures.study.nothing-generated-yet-says-so
title: An aid that does not exist says so rather than showing blank
state: live
autonomy: gated
behavior: >
  Opening a study aid that has never been generated, or whose generation failed, shows a plain
  statement that none is available for that chapter instead of an empty panel that looks like a
  broken screen.
