kind: specification
id: scriptures.importing.text-only-arrives-when-asked-for
title: Scripture only enters the install when someone imports it
state: live
autonomy: gated
behavior: >
  Scripture text enters an install exactly once, when a person runs the import command by hand; the
  app never downloads a translation on its own, never fetches missing text while someone is reading,
  and never adds an edition because a request referred to one. An install with nothing imported
  stays empty until somebody decides otherwise.
implements:
- import_bible.py
- routes.py::api_read_chapter
tests: []
links: {}
notes: ''
